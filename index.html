<!DOCTYPE html>
<html>
<head>
    <title>Shaan's Bio Tracker</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 15px; margin: 10px; border-left: 5px solid #2ecc71; border-radius: 5px; }
        h1 { color: #2c3e50; }
    </style>
</head>
<body>
    <h1>Shaan's Biology Classes 📚</h1>
    <div id="data-container">Loading classes...</div>

    <script>
        // Ye code tumhari JSON file se data khichega
        fetch('biology_data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('data-container');
                container.innerHTML = '';
                data.reverse().forEach(entry => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <strong>Batch:</strong> ${entry["Batch Name"]} | <strong>Timing:</strong> ${entry.Timing}<br>
                        <strong>Date:</strong> ${entry.Date} | <strong>Class:</strong> ${entry.Class}<br>
                        <strong>Topic:</strong> ${entry.Topic} (${entry.Unit})<br>
                        <strong>Homework:</strong> ${entry.Homework}
                    `;
                    container.appendChild(div);
                });
            });
    </script>
</body>
</html>
